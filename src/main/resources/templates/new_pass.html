<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta http-equiv="content-type" content="text/html" charset="UTF-8">
  <title>Main page</title>
  <link href="styles/style.css" th:href="@{styles/style.css}" rel="stylesheet" type="text/css"/>
</head>
<body>
<!-- Основной контейнер, включающий остальные DIV-->
<div id="container">

  <div class="header">
    <div class="block_logo"> <a href="/"> <img src="images/logo.jpg" width="433" height="123" border="0"> </a> </div>
  </div>
  <div class="line1"></div>

  <br /><br />
  <div id="regform_holder">
    <div class="regform">
      <form id="form">
        <h2> Придумайте новый пароль </h2>
        <input type="hidden" name="token" th:value="${tokenDto.token}" id="token">
        <p><input type="password" placeholder="Пароль" id="password"></p>
        <p><input type="password" placeholder="Подтвердите пароль" id="confirmPassword"></p>
      </form>
      <div class="hide-error" id="errorPassword">Пароли не совпадают</div>
      <p><button id="saveButton">Сохранить</button></p>
    </div>
    <div class="hide" id="confirmText" style="font-size: 14px; font-weight: bolder; color: #0057ad; text-align: center;">
      Пароль успешно сохранен.
    </div>
  </div>

  <!--
  <div id="block2">
    <textarea id="responseTextArea" placeholder="Response text 1 - For development issues"></textarea>
  </div>
  -->

  <div id="footer">
    <div class="rights_text_holder">
      <p class="shrimping_height"> 2025 &#169; Все права защищены.</p>
      <p class="shrimping_height">
            <span id="trade_mark"><a href="/"> ИП Скляр Федор Васильевич
              <!-- OOO &#171;Logistics Pro&#187; --> </a></span>.</p>
      <p class="shrimping_height">Полное или частичное использование материалов данного сайта возможно только с письменного разрешения администрации сайта.</p>
    </div>
  </div>

</div>
<!-- Блок JavaScript лучше всего подключать здесь - в конце <body>, т.к. иначе не считываются элементы DOM-->
<!-- В шаблонизаторе Thymeleaf джава скрипт подключается особым образом. См. ниже  -->
<script src="js/script2.js"></script>
</body>
</html>
