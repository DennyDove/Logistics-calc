spring:
  config:
    activate:
      on-profile: mysql

  servlet:
    multipart:
      max-file-size: 1280KB
      max-request-size: 1280KB

  datasource:
    driverClassName: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/enterprise
    username: root
    password: root
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update

logging:
  level:
    root: info